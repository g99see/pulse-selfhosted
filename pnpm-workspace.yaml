packages:
  - apps/*
  - packages/*
  - docs-site

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # esbuild нужен для сборки VitePress (документация, ТЗ §10): postinstall
  # ставит платформенный бинарник. Без него vitepress build падает.
  esbuild: true
  # Нативный модуль: pnpm 11 падает с ERR_PNPM_IGNORED_BUILDS без явного разрешения.
  # Сборка не компилируется — пакет везёт готовые prebuilds, в т.ч. linux-x64 musl.
  argon2: true
  # Опциональный нативный ускоритель msgpackr (зависимость bullmq).
  # Схемы уведомлений работают на чистом JS-фолбэке — сборку не разрешаем.
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - '@next/env@15.5.27'
  - '@next/swc-darwin-arm64@15.5.27'
  - '@next/swc-darwin-x64@15.5.27'
  - '@next/swc-linux-arm64-gnu@15.5.27'
  - '@next/swc-linux-arm64-musl@15.5.27'
  - '@next/swc-linux-x64-gnu@15.5.27'
  - '@next/swc-linux-x64-musl@15.5.27'
  - '@next/swc-win32-arm64-msvc@15.5.27'
  - '@next/swc-win32-x64-msvc@15.5.27'
  - next@15.5.27
  - bullmq@6.3.11
