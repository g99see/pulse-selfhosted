name: puls

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puls}
      POSTGRES_DB: ${POSTGRES_DB:-puls}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-puls} -d ${POSTGRES_DB:-puls}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - puls

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - puls

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-puls}:${POSTGRES_PASSWORD:-puls}@postgres:5432/${POSTGRES_DB:-puls}?schema=public
      REDIS_URL: redis://valkey:6379
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - puls

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - puls

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # CADDY_BIND — адрес публикации на хосте. По умолчанию все интерфейсы;
      # задайте 127.0.0.1, если 80/443 уже заняты другим сервисом (Tailscale и т.п.).
      - '${CADDY_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${CADDY_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SANDBOX_DOMAIN: ${SANDBOX_DOMAIN:-usercontent.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      # Caddy должен знать внешний порт HTTPS, иначе редирект с 80 ведёт на занятый 443.
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - puls

volumes:
  pgdata:
  valkeydata:
  caddy_data:
  caddy_config:

networks:
  puls:
    driver: bridge
