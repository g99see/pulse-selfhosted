name: puls

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puls}
      POSTGRES_DB: ${POSTGRES_DB:-puls}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-puls} -d ${POSTGRES_DB:-puls}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - puls

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - puls

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-puls}:${POSTGRES_PASSWORD:-puls}@postgres:5432/${POSTGRES_DB:-puls}?schema=public
      REDIS_URL: redis://valkey:6379
      # Доп. origin-ы (например https://puls.x.ts.net через Tailscale), через пробел.
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      WEB_APP_URL: ${PUBLIC_ORIGIN:-http://localhost}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Пульс <noreply@example.com>}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # polling по умолчанию: вебхуку нужен публичный HTTPS-адрес, которого у
      # домашнего сервера нет. Для вебхука: TELEGRAM_MODE=webhook + секрет.
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Discord-бот: токен и ID приложения из Discord Developer Portal.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      # Привязка одним нажатием (ТЗ §6): client_secret и публичный redirect URI.
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:-}
      RATES_PROVIDER: ${RATES_PROVIDER:-}
      APP_VERSION: ${APP_VERSION:-0.3.0}
      DOMAIN: ${DOMAIN:-localhost}
      # Флаг Secure для cookie в режиме http; пусто — по схеме PUBLIC_ORIGIN.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Открытый API/вебхуки (Фаза 4, блок E): разрешить доставку вебхуков на
      # приватные адреса (127.0.0.1, 10/8, 192.168/16 и т.п.). По умолчанию
      # запрещено — защита от SSRF. Включайте только для локальных интеграций.
      WEBHOOKS_ALLOW_PRIVATE: ${WEBHOOKS_ALLOW_PRIVATE:-0}
    # Локальные AI-провайдеры (Фаза 4, ТЗ §3.9): Ollama/LM Studio на хосте
    # доступны из контейнера api по имени host.docker.internal.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - puls

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # '/' — тот же origin, что и сайт (работает по любому адресу установки).
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - puls

  # Плановый бэкап (ТЗ §6, §10): дамп PostgreSQL + метаданные (версия миграции)
  # в ./backups, ротация старых архивов, healthcheck по свежести последнего
  # успешного бэкапа. Восстановление — scripts/restore.sh, обновление — scripts/upgrade.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # root нужен, чтобы писать в bind-mount ./backups независимо от UID хоста.
    user: '0:0'
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-puls}
      PGPASSWORD: ${POSTGRES_PASSWORD:-puls}
      PGDATABASE: ${POSTGRES_DB:-puls}
      BACKUP_MODE: local
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      APP_VERSION: ${APP_VERSION:-0.3.0}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ['sh', '/usr/local/bin/backup.sh', '--daemon']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Свежесть последнего успешного бэкапа: не старше двух интервалов.
      test: ['CMD', 'sh', '/usr/local/bin/backup.sh', '--healthcheck']
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - puls

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # CADDY_BIND — адрес публикации на хосте. По умолчанию все интерфейсы;
      # задайте 127.0.0.1, если 80/443 уже заняты другим сервисом (Tailscale и т.п.).
      - '${CADDY_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${CADDY_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
      # Для Tailscale Serve (Caddyfile.http): только loopback, наружу не торчат.
      - '127.0.0.1:${TS_HTTP_PORT:-8081}:8081'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      # Публичный origin основного сайта.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
      # Caddy должен знать внешний порт HTTPS, иначе редирект с 80 ведёт на занятый 443.
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      # CADDYFILE=Caddyfile.http — режим http в локальной сети без домена.
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - puls

  # --- Локальный AI-провайдер (Фаза 4, ТЗ §3.9): необязательный сервис. ---
  # Чтобы данные не покидали сервер, поднимите Ollama и выберите в настройках AI
  # провайдер «OpenAI-совместимый». Адрес: http://ollama:11434/v1 (из этого же
  # compose) либо http://host.docker.internal:11434/v1 (Ollama на хосте).
  # Включается профилем: docker compose --profile ai-local up -d
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   profiles: ['ai-local']
  #   ports:
  #     - '${OLLAMA_PORT:-11434}:11434'
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   healthcheck:
  #     test: ['CMD', 'ollama', 'list']
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  #   networks:
  #     - puls

volumes:
  pgdata:
  valkeydata:
  caddy_data:
  caddy_config:
  # Данные локальной модели Ollama (раскомментируйте вместе с сервисом выше).
  # ollama_models:

networks:
  puls:
    driver: bridge
